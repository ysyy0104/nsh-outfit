<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逆水寒手游外觀資料庫｜台服・陸服</title>
  <style>
    :root {
      --bg: #121212; --card: #1e1e1e; --sub: #262626; --border: #383838;
      --text: #eeeeee; --muted: #999999; --primary: #4a90e2; --accent: #f5a623;
    }
    body.light {
      --bg: #f4f5f7; --card: #ffffff; --sub: #f0f2f5; --border: #dcdcdc;
      --text: #222222; --muted: #666666; --primary: #2b7de9; --accent: #d98200;
    }
    body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: 0.2s; }
    .hidden { display: none !important; }
    .container { max-width: 1100px; margin: auto; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    input, textarea, select { padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--sub); color: var(--text); width: 100%; box-sizing: border-box; font-size: 14px; margin-top: 4px; }
    button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--sub); color: var(--text); cursor: pointer; font-size: 13px; font-weight: bold; }
    button:hover { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: #fff; border: none; }
    .btn-danger { background: #d9534f; color: #fff; border: none; }
    .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { padding: 8px 18px; font-size: 14px; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tag-chip { display: inline-block; padding: 4px 10px; border-radius: 15px; border: 1px solid var(--border); background: var(--sub); font-size: 12px; cursor: pointer; margin: 3px; user-select: none; }
    .tag-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 650px) { .grid-2 { grid-template-columns: 1fr; } }
    label { font-size: 13px; color: var(--muted); display: block; margin-top: 8px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .card-media { width: 100%; height: 240px; object-fit: cover; background: #000; cursor: pointer; }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--sub); border: 1px solid var(--border); margin: 2px 3px 2px 0; }
    .cal-item { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: flex; justify-content: center; align-items: center; padding: 16px; z-index: 999; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; }
    .modal-box img, .modal-box video { width: 100%; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- 管理員登入視窗 -->
  <div id="login-view" class="panel" style="max-width: 380px; margin: 90px auto;">
    <h2 style="margin-top:0;">管理員登入</h2>
    <input type="email" id="email" placeholder="管理員信箱">
    <input type="password" id="password" placeholder="密碼" style="margin-top:8px;">
    <button id="login-btn" class="btn-primary" style="width:100%; margin-top:12px; padding:10px;">登入資料庫</button>
    <p id="login-msg" style="color:#ff6b6b; font-size:13px; margin-bottom:0;"></p>
  </div>

  <!-- 主資料庫畫面 -->
  <div id="app-view" class="container hidden">
    <div class="header">
      <div>
        <span style="font-size:12px; color:var(--muted);">逆水寒手游外觀資料庫｜ 台服・陸服</span>
        <h1 style="margin:4px 0 0; font-size:22px;">逆水寒手游外觀資料庫</h1>
      </div>
      <div class="header-actions">
        <button id="theme-btn" type="button">明暗</button>
        <button id="open-add-btn" class="btn-primary" type="button">＋ 新增外觀</button>
        <button id="import-btn" type="button">匯入 JSON</button>
        <button id="export-btn" type="button">匯出備份</button>
        <button id="logout-btn" type="button">登出</button>
        <input type="file" id="import-file" accept=".json" class="hidden">
      </div>
    </div>

    <!-- 分頁切換 -->
    <div class="tabs">
      <button id="tab-gallery" class="tab-btn active" type="button">外觀圖鑑</button>
      <button id="tab-calendar" class="tab-btn" type="button">台服外觀日曆</button>
    </div>

    <!-- 檢視 1：外觀圖鑑 -->
    <div id="view-gallery">
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" id="toggle-tags-panel">
          <strong style="font-size:14px;">獎池標籤 ▾</strong>
          <div style="display:flex; gap:6px; align-items:center;" onclick="event.stopPropagation()">
            <button id="mode-all" class="btn-primary" style="padding:4px 8px; font-size:12px;">全部符合</button>
            <button id="mode-any" style="padding:4px 8px; font-size:12px;">任一符合</button>
            <button id="clear-filters" style="padding:4px 8px; font-size:12px;">清除</button>
          </div>
        </div>
        <div id="filter-tags-container" style="margin-top:10px;"></div>

        <div class="filter-bar">
          <div style="display:flex; gap:8px; flex:1; min-width:240px;">
            <input type="text" id="search-input" placeholder="搜尋名稱、分類、獲取途徑、版本..." style="margin:0;">
            <select id="cat-filter" style="width:140px; margin:0;"><option value="">全部大類</option></select>
          </div>
          <div style="display:flex; gap:12px; align-items:center;">
            <label style="margin:0; display:flex; align-items:center; gap:5px; cursor:pointer; color:var(--text);">
              <input type="checkbox" id="tw-unreleased" style="width:auto; margin:0;"> 只看台服未上線
            </label>
            <button id="sort-btn" type="button">由新到舊 ↓</button>
          </div>
        </div>
      </div>

      <div id="status-text" style="margin-bottom:10px; font-size:13px; color:var(--muted);">載入中…</div>
      <div id="cards-container" class="cards"></div>
    </div>

    <!-- 檢視 2：台服外觀日曆 -->
    <div id="view-calendar" class="hidden">
      <div id="calendar-container">載入中…</div>
    </div>
  </div>

  <!-- 新增 / 編輯外觀 Modal -->
  <div id="form-modal" class="modal hidden">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px;">
        <h2 id="modal-form-title" style="margin:0; font-size:18px;">新增外觀</h2>
        <button id="close-form-x" type="button">✕</button>
      </div>
      <input type="hidden" id="f-id">

      <div class="grid-2">
        <div><label>大類</label><input type="text" id="f-cat" placeholder="例如：時裝、髮型、坐騎、武器"></div>
        <div><label>子分類</label><input type="text" id="f-subcat" placeholder="例如：直售、天賞、祥瑞"></div>
      </div>
      <div class="grid-2">
        <div><label>名稱 *</label><input type="text" id="f-name" placeholder="外觀名稱"></div>
        <div><label>售價</label><input type="text" id="f-price" placeholder="例如：2880紋玉 / 1顆天賞石"></div>
      </div>
      <div><label>獲取途徑</label><input type="text" id="f-source" placeholder="例如：商城直售 / 神石鑒賞 / 活動免費"></div>

      <div>
        <label>獎池標籤（可多選）</label>
        <div id="form-tags-container" style="margin-top:4px;"></div>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <input type="text" id="custom-tag-input" placeholder="輸入自訂標籤後按新增..." style="margin:0;">
          <button id="add-custom-tag-btn" type="button" style="white-space:nowrap;">＋ 標籤</button>
        </div>
      </div>

      <div class="grid-2">
        <div><label>陸服上線日期</label><input type="date" id="f-cn-date"></div>
        <div><label>陸服上線版本</label><input type="text" id="f-cn-ver" placeholder="例如：1.3.2"></div>
      </div>
      <div class="grid-2">
        <div><label>台服上線日期（留空視為未上線）</label><input type="date" id="f-tw-date"></div>
        <div><label>台服上線版本</label><input type="text" id="f-tw-ver" placeholder="例如：1.2.1"></div>
      </div>
      <div class="grid-2">
        <div><label>公告連結</label><input type="text" id="f-link" placeholder="貼上官方微博/粉專公告網址"></div>
        <div><label>備註</label><input type="text" id="f-note" placeholder="偏色、染色或禮盒內容說明"></div>
      </div>
      <div>
        <label>圖片與動態（可多選，一行一個網址，第一張為封面，支援圖片或 .mp4 影片網址）</label>
        <textarea id="f-media" rows="3" placeholder="貼上圖片或動態影片網址..."></textarea>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px; border-top:1px solid var(--border); padding-top:12px;">
        <button id="cancel-form-btn" type="button">取消</button>
        <button id="save-form-btn" class="btn-primary" type="button">儲存</button>
      </div>
    </div>
  </div>

  <!-- 詳情多圖檢視 Modal -->
  <<div id="detail-modal" class="modal hidden">
<div class="modal-box">
<div style="display:flex; justify-content:space-between; align-items:center;">
<h2 id="d-name" style="margin:0;"></h2>
<button id="close-detail-btn" type="button">✕</button>
</div>
<div id="d-info" style="font-size:13px; color:var(--muted); margin:10px 0; line-height:1.7;"></div>
<div id="d-tags" style="margin-bottom:10px;"></div>
<div id="d-media"></div>
</div>
</div>
  <script>
    const proto = "ht" + "tps://";
    const host = ["www", "gstatic", "com"].join(".");
    const path = "/firebasejs/10.8.0/";
    const files = ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js"];

    function loadScript(file) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = proto + host + path + file;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    (async function init() {
      for (const f of files) await loadScript(f);

      const firebaseConfig = {
        apiKey: "AIzaSyBTRmc9Kh_8er4_-Z8QMAV5rQghcoK6HYU",
        authDomain: "nsh-db-1321c." + ["firebaseapp", "com"].join("."),
        projectId: "nsh-db-1321c",
        storageBucket: "nsh-db-1321c." + ["firebasestorage", "app"].join("."),
        messagingSenderId: "887842444277",
        appId: "1:887842444277:web:8d6372cc3362aa231bc6bc"
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      const DEFAULT_TAGS = ["天賞髮型", "聯動", "賽季", "大獎", "進階", "贈禮", "偏色", "品級", "地點", "限購", "系列", "類別"];
      let allItems = [];
      let selectedFilterTags = new Set();
      let selectedFormTags = new Set();
      let filterMode = "ALL";
      let sortDesc = true;

      document.getElementById('theme-btn').addEventListener('click', () => {
        document.body.classList.toggle('light');
      });

      auth.onAuthStateChanged((user) => {
        if (user) {
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('app-view').classList.remove('hidden');
          loadData();
        } else {
          document.getElementById('login-view').classList.remove('hidden');
          document.getElementById('app-view').classList.add('hidden');
        }
      });

      document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const pw = document.getElementById('password').value;
        const msg = document.getElementById('login-msg');
        msg.innerText = "驗證中...";
        try {
          await auth.signInWithEmailAndPassword(email, pw);
          msg.innerText = "";
        } catch (e) {
          msg.innerText = "登入失敗：" + e.message;
        }
      });

      document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());

      document.getElementById('tab-gallery').addEventListener('click', () => {
        document.getElementById('tab-gallery').classList.add('active');
        document.getElementById('tab-calendar').classList.remove('active');
        document.getElementById('view-gallery').classList.remove('hidden');
        document.getElementById('view-calendar').classList.add('hidden');
      });

      document.getElementById('tab-calendar').addEventListener('click', () => {
        document.getElementById('tab-calendar').classList.add('active');
        document.getElementById('tab-gallery').classList.remove('active');
        document.getElementById('view-calendar').classList.remove('hidden');
        document.getElementById('view-gallery').classList.add('hidden');
        renderCalendar();
      });

      function getAllAvailableTags() {
        const set = new Set(DEFAULT_TAGS);
        allItems.forEach(item => (item.tags || []).forEach(t => set.add(t)));
        return [...set];
      }

      function renderFilterTags() {
        const container = document.getElementById('filter-tags-container');
        container.innerHTML = getAllAvailableTags().map(tag => `
          <span class="tag-chip ${selectedFilterTags.has(tag) ? 'active' : ''}" data-ftag="${tag}">${tag}</span>
        `).join('');
      }

      function renderFormTags() {
        const container = document.getElementById('form-tags-container');
        container.innerHTML = getAllAvailableTags().map(tag => `
          <span class="tag-chip ${selectedFormTags.has(tag) ? 'active' : ''}" data-formtag="${tag}">${tag}</span>
        `).join('');
      }

      document.getElementById('filter-tags-container').addEventListener('click', (e) => {
        const t = e.target.getAttribute('data-ftag');
        if (!t) return;
        selectedFilterTags.has(t) ? selectedFilterTags.delete(t) : selectedFilterTags.add(t);
        renderFilterTags();
        renderCards();
      });

      document.getElementById('form-tags-container').addEventListener('click', (e) => {
        const t = e.target.getAttribute('data-formtag');
        if (!t) return;
        selectedFormTags.has(t) ? selectedFormTags.delete(t) : selectedFormTags.add(t);
        renderFormTags();
      });

      document.getElementById('add-custom-tag-btn').addEventListener('click', () => {
        const val = document.getElementById('custom-tag-input').value.trim();
        if (!val) return;
        DEFAULT_TAGS.push(val);
        selectedFormTags.add(val);
        document.getElementById('custom-tag-input').value = "";
        renderFormTags();
        renderFilterTags();
      });

      document.getElementById('toggle-tags-panel').addEventListener('click', () => {
        document.getElementById('filter-tags-container').classList.toggle('hidden');
      });

      document.getElementById('mode-all').addEventListener('click', () => {
        filterMode = "ALL";
        document.getElementById('mode-all').classList.add('btn-primary');
        document.getElementById('mode-any').classList.remove('btn-primary');
        renderCards();
      });

      document.getElementById('mode-any').addEventListener('click', () => {
        filterMode = "ANY";
        document.getElementById('mode-any').classList.add('btn-primary');
        document.getElementById('mode-all').classList.remove('btn-primary');
        renderCards();
      });

      document.getElementById('clear-filters').addEventListener('click', () => {
        selectedFilterTags.clear();
        document.getElementById('search-input').value = "";
        document.getElementById('cat-filter').value = "";
        document.getElementById('tw-unreleased').checked = false;
        renderFilterTags();
        renderCards();
      });

      document.getElementById('sort-btn').addEventListener('click', () => {
        sortDesc = !sortDesc;
        document.getElementById('sort-btn').innerText = sortDesc ? "由新到舊 ↓" : "由舊到新 ↑";
        renderCards();
      });

      ['search-input', 'cat-filter', 'tw-unreleased'].forEach(id => {
        document.getElementById(id).addEventListener('input', renderCards);
      });

      function openForm(item = null) {
        document.getElementById('modal-form-title').innerText = item ? "編輯外觀" : "新增外觀";
        document.getElementById('f-id').value = item ? item.id : "";
        document.getElementById('f-cat').value = item ? (item.category || "") : "";
        document.getElementById('f-subcat').value = item ? (item.subCategory || "") : "";
        document.getElementById('f-name').value = item ? (item.name || "") : "";
        document.getElementById('f-price').value = item ? (item.price || "") : "";
        document.getElementById('f-source').value = item ? (item.source || "") : "";
        document.getElementById('f-cn-date').value = item ? (item.cnDate || "") : "";
        document.getElementById('f-cn-ver').value = item ? (item.cnVer || "") : "";
        document.getElementById('f-tw-date').value = item ? (item.twDate || "") : "";
        document.getElementById('f-tw-ver').value = item ? (item.twVer || "") : "";
        document.getElementById('f-link').value = item ? (item.link || "") : "";
        document.getElementById('f-note').value = item ? (item.note || "") : "";
        document.getElementById('f-media').value = item ? ((item.images || []).join('\n')) : "";
        selectedFormTags = new Set(item ? (item.tags || []) : []);
        renderFormTags();
        document.getElementById('form-modal').classList.remove('hidden');
      }

      document.getElementById('open-add-btn').addEventListener('click', () => openForm());
      document.getElementById('close-form-x').addEventListener('click', () => document.getElementById('form-modal').classList.add('hidden'));
      document.getElementById('cancel-form-btn').addEventListener('click', () => document.getElementById('form-modal').classList.add('hidden'));

      document.getElementById('save-form-btn').addEventListener('click', async () => {
        const name = document.getElementById('f-name').value.trim();
        if (!name) return alert("請輸入外觀名稱！");
        const btn = document.getElementById('save-form-btn');
        btn.disabled = true; btn.innerText = "儲存中...";
        try {
          const id = document.getElementById('f-id').value;
          const payload = {
            category: document.getElementById('f-cat').value.trim(),
            subCategory: document.getElementById('f-subcat').value.trim(),
            name: name,
            price: document.getElementById('f-price').value.trim(),
            source: document.getElementById('f-source').value.trim(),
            tags: [...selectedFormTags],
            cnDate: document.getElementById('f-cn-date').value,
            cnVer: document.getElementById('f-cn-ver').value.trim(),
            twDate: document.getElementById('f-tw-date').value,
            twVer: document.getElementById('f-tw-ver').value.trim(),
            link: document.getElementById('f-link').value.trim(),
            note: document.getElementById('f-note').value.trim(),
            images: document.getElementById('f-media').value.split('\n').map(u => u.trim()).filter(Boolean)
          };
          if (id) {
            await db.collection("outfits").doc(id).update(payload);
          } else {
            payload.createdAt = Date.now();
            await db.collection("outfits").add(payload);
          }
          document.getElementById('form-modal').classList.add('hidden');
          loadData();
        } catch (e) {
          alert("儲存失敗：" + e.message);
        } finally {
          btn.disabled = false; btn.innerText = "儲存";
        }
      });

      async function loadData() {
        document.getElementById('status-text').innerText = "載入中…";
        try {
          const snap = await db.collection("outfits").get();
          allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          const cats = [...new Set(allItems.map(i => i.category).filter(Boolean))];
          document.getElementById('cat-filter').innerHTML = '<option value="">全部大類</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
          renderFilterTags();
          renderCards();
          renderCalendar();
        } catch (e) {
          document.getElementById('status-text').innerText = "讀取失敗：" + e.message;
        }
      }

      function isVideo(url) { return /\.(mp4|webm|ogg)(\?.*)?$/i.test(url); }

      function renderCards() {
        const kw = document.getElementById('search-input').value.toLowerCase();
        const cat = document.getElementById('cat-filter').value;
        const onlyTwUnreleased = document.getElementById('tw-unreleased').checked;
        const today = new Date().toISOString().slice(0, 10);

        let list = allItems.filter(item => {
          if (cat && item.category !== cat) return false;
          if (onlyTwUnreleased && item.twDate && item.twDate <= today) return false;
          if (selectedFilterTags.size > 0) {
            const itemTags = new Set(item.tags || []);
            if (filterMode === "ALL") {
              for (let t of selectedFilterTags) if (!itemTags.has(t)) return false;
            } else {
              let hit = false;
              for (let t of selectedFilterTags) if (itemTags.has(t)) hit = true;
              if (!hit) return false;
            }
          }
          if (kw) {
            const hay = [item.name, item.category, item.subCategory, item.source, item.cnVer, item.twVer, item.note, ...(item.tags || [])].join(" ").toLowerCase();
            if (!hay.includes(kw)) return false;
          }
          return true;
        });

        list.sort((a, b) => {
          const ta = a.twDate || a.cnDate || String(a.createdAt || 0);
          const tb = b.twDate || b.cnDate || String(b.createdAt || 0);
          return sortDesc ? tb.localeCompare(ta) : ta.localeCompare(tb);
        });

        document.getElementById('status-text').innerText = `共 ${list.length} 筆外觀資料`;
                document.getElementById('cards-container').innerHTML = list.map(item => {
          const cover = (item.images && item.images.length > 0) ? item.images[0] : "";
          const mediaHtml = cover
            ? (isVideo(cover) ? '<video src="' + cover + '" class="card-media open-detail" data-id="' + item.id + '" muted loop autoplay></video>' : '<img src="' + cover + '" class="card-media open-detail" data-id="' + item.id + '">')
            : '<div class="card-media open-detail" data-id="' + item.id + '" style="display:flex;align-items:center;justify-content:center;color:#666;">無預覽圖</div>';
          const tagsHtml = (item.tags || []).map(t => '<span class="badge">' + t + '</span>').join('');
          const catText = [item.category, item.subCategory].filter(Boolean).join(' · ') || '未分類';
          return '<div class="card">' + mediaHtml +
            '<div class="card-body"><div>' +
              '<div style="font-size:12px; color:var(--muted);">' + catText + '</div>' +
              '<h3 style="margin:4px 0; font-size:16px;">' + item.name + '</h3>' +
              '<div style="color:var(--accent); font-size:13px; font-weight:bold;">' + (item.price || '') + (item.source ? ' (' + item.source + ')' : '') + '</div>' +
              '<div style="font-size:12px; color:var(--muted); margin-top:6px;">' +
                '台服：' + (item.twDate || '未上線') + (item.twVer ? ' [' + item.twVer + ']' : '') + '<br>' +
                '陸服：' + (item.cnDate || '未填') + (item.cnVer ? ' [' + item.cnVer + ']' : '') +
              '</div>' +
              '<div style="margin-top:6px;">' + tagsHtml + '</div>' +
            '</div>' +
            '<div style="display:flex; gap:6px; margin-top:10px; padding-top:8px; border-top:1px solid var(--border);">' +
              '<button type="button" class="edit-item" data-id="' + item.id + '" style="flex:1; padding:5px;">編輯</button>' +
              '<button type="button" class="btn-danger del-item" data-id="' + item.id + '" style="padding:5px 10px;">刪除</button>' +
            '</div></div></div>';
        }).join('');
      }

              function renderCards() {
          const kw = document.getElementById('search-input').value.toLowerCase();
          const cat = document.getElementById('cat-filter').value;
          const onlyTwUnreleased = document.getElementById('tw-unreleased').checked;
          const today = new Date().toISOString().slice(0, 10);

          let list = allItems.filter(item => {
            if (cat && item.category !== cat) return false;
            if (onlyTwUnreleased && item.twDate && item.twDate <= today) return false;
            if (selectedFilterTags.size > 0) {
              const itemTags = new Set(item.tags || []);
              if (filterMode === "ALL") {
                for (let t of selectedFilterTags) if (!itemTags.has(t)) return false;
              } else {
                let hit = false;
                for (let t of selectedFilterTags) if (itemTags.has(t)) hit = true;
                if (!hit) return false;
              }
            }
            if (kw) {
              const hay = [item.name, item.category, item.subCategory, item.source, item.cnVer, item.twVer, item.note, ...(item.tags || [])].join(" ").toLowerCase();
              if (!hay.includes(kw)) return false;
            }
            return true;
          });

          list.sort((a, b) => {
            const ta = a.twDate || a.cnDate || String(a.createdAt || 0);
            const tb = b.twDate || b.cnDate || String(b.createdAt || 0);
            return sortDesc ? tb.localeCompare(ta) : ta.localeCompare(tb);
          });

          document.getElementById('status-text').innerText = '共 ' + list.length + ' 筆外觀資料';
          document.getElementById('cards-container').innerHTML = list.map(item => {
            const cover = (item.images && item.images.length > 0) ? item.images[0] : "";
            const mediaHtml = cover
              ? (isVideo(cover) ? '<video src="' + cover + '" class="card-media open-detail" data-id="' + item.id + '" muted loop autoplay></video>' : '<img src="' + cover + '" class="card-media open-detail" data-id="' + item.id + '">')
              : '<div class="card-media open-detail" data-id="' + item.id + '" style="display:flex;align-items:center;justify-content:center;color:#666;">無預覽圖</div>';
            const tagsHtml = (item.tags || []).map(t => '<span class="badge">' + t + '</span>').join('');
            const catText = [item.category, item.subCategory].filter(Boolean).join(' · ') || '未分類';
            return '<div class="card">' + mediaHtml +
              '<div class="card-body"><div>' +
                '<div style="font-size:12px; color:var(--muted);">' + catText + '</div>' +
                '<h3 style="margin:4px 0; font-size:16px;">' + item.name + '</h3>' +
                '<div style="color:var(--accent); font-size:13px; font-weight:bold;">' + (item.price || '') + (item.source ? ' (' + item.source + ')' : '') + '</div>' +
                '<div style="font-size:12px; color:var(--muted); margin-top:6px;">' +
                  '台服：' + (item.twDate || '未上線') + (item.twVer ? ' [' + item.twVer + ']' : '') + '<br>' +
                  '陸服：' + (item.cnDate || '未填') + (item.cnVer ? ' [' + item.cnVer + ']' : '') +
                '</div>' +
                '<div style="margin-top:6px;">' + tagsHtml + '</div>' +
              '</div>' +
              '<div style="display:flex; gap:6px; margin-top:10px; padding-top:8px; border-top:1px solid var(--border);">' +
                '<button type="button" class="edit-item" data-id="' + item.id + '" style="flex:1; padding:5px;">編輯</button>' +
                '<button type="button" class="btn-danger del-item" data-id="' + item.id + '" style="padding:5px 10px;">刪除</button>' +
              '</div></div></div>';
          }).join('');
        }

        function renderCalendar() {
          const sorted = [...allItems].sort((a, b) => (b.twDate || '0000').localeCompare(a.twDate || '0000'));
          document.getElementById('calendar-container').innerHTML = sorted.length ? sorted.map(item =>
            '<div class="cal-item"><div>' +
              '<strong style="color:var(--primary); margin-right:8px;">' + (item.twDate || '日期待定') + '</strong>' +
              '<span class="badge">' + (item.category || '未分類') + '</span> ' +
              '<strong>' + item.name + '</strong>' +
              '<span style="color:var(--accent); font-size:13px; margin-left:6px;">' + (item.price || '') + '</span>' +
              '<div style="font-size:12px; color:var(--muted); margin-top:4px;">' +
                '陸服：' + (item.cnDate || '未填') + (item.cnVer ? ' [' + item.cnVer + ']' : '') + (item.note ? ' ｜備註：' + item.note : '') +
              '</div></div>' +
              '<button type="button" class="open-detail" data-id="' + item.id + '">檢視多圖</button>' +
            '</div>'
          ).join('') : '<div class="panel">尚無外觀時程資料</div>';
        }

        document.getElementById('app-view').addEventListener('click', async (e) => {
          const id = e.target.getAttribute('data-id');
          if (!id) return;
          const item = allItems.find(i => i.id === id);
          if (!item) return;

          if (e.target.classList.contains('open-detail')) {
            document.getElementById('d-name').innerText = item.name;
            document.getElementById('d-info').innerHTML =
              '分類：' + ([item.category, item.subCategory].filter(Boolean).join(' / ') || '無') + '<br>' +
              '售價與途徑：' + (item.price || '無') + ' ｜ ' + (item.source || '無') + '<br>' +
              '台服上線：' + (item.twDate || '未上線') + (item.twVer ? ' (' + item.twVer + ')' : '') + '<br>' +
              '陸服上線：' + (item.cnDate || '未填') + (item.cnVer ? ' (' + item.cnVer + ')' : '') + '<br>' +
              (item.link ? '公告連結：<a href="' + item.link + '" target="_blank" style="color:var(--primary);">點此開啟</a><br>' : '') +
              (item.note ? '備註：' + item.note : '');
            document.getElementById('d-tags').innerHTML = (item.tags || []).map(t => '<span class="badge">' + t + '</span>').join('');
            document.getElementById('d-media').innerHTML = (item.images || []).map(u => isVideo(u) ? '<video src="' + u + '" controls></video>' : '<img src="' + u + '">').join('');
            document.getElementById('detail-modal').classList.remove('hidden');
          }
          if (e.target.classList.contains('edit-item')) openForm(item);
          if (e.target.classList.contains('del-item')) {
            if (confirm('確定刪除「' + item.name + '」？')) {
              await db.collection("outfits").doc(id).delete();
              loadData();
            }
          }
        });

        document.getElementById('close-detail-btn').addEventListener('click', () => document.getElementById('detail-modal').classList.add('hidden'));

        document.getElementById('export-btn').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(allItems, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = 'nsh-outfits-backup-' + new Date().toISOString().slice(0, 10) + '.json';
          a.click();
        });

        document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
        document.getElementById('import-file').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const arr = JSON.parse(await file.text());
            if (!Array.isArray(arr)) throw new Error("JSON 格式必須為陣列");
            for (const obj of arr) {
              const { id, ...clean } = obj;
              clean.createdAt = clean.createdAt || Date.now();
              await db.collection("outfits").add(clean);
            }
            alert('成功匯入 ' + arr.length + ' 筆資料至雲端！');
            loadData();
          } catch (err) {
            alert("匯入失敗：" + err.message);
          }
        });
      } catch (err) {
        document.getElementById('login-msg').innerText = "程式初始化錯誤：" + err.message;
      }
    })();
  </script>
</body>
</html>
