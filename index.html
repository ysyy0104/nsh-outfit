<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逆水寒手游外觀資料庫（私人版）</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #eee; margin: 0; padding: 20px; }
    .hidden { display: none !important; }
    .box { max-width: 1000px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
    input, textarea, select, button { padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; width: 100%; box-sizing: border-box; font-size: 14px; }
    button { background: #4a90e2; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #357abd; }
    .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; }
    .btn-danger { background: #d9534f; }
    .btn-danger:hover { background: #c9302c; }
    .btn-sec { background: #555; }
    .btn-sec:hover { background: #666; }
    .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid #333; padding-bottom: 15px; }
    .tabs { display: flex; gap: 10px; margin: 15px 0; }
    .tab-btn { background: #2a2a2a; width: auto; padding: 8px 16px; }
    .tab-btn.active { background: #4a90e2; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 15px; margin-top: 15px; }
    .card { background: #262626; border-radius: 8px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 220px; object-fit: cover; cursor: pointer; }
    .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .tag { display: inline-block; background: #3a3a3a; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 2px 4px 2px 0; }
    .cal-item { background: #262626; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #4a90e2; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 999; }
    .modal-content { background: #1e1e1e; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; border-radius: 10px; border: 1px solid #444; }
    .modal-imgs img { width: 100%; border-radius: 6px; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="login-view" class="box" style="max-width: 400px; margin-top: 80px;">
    <h2>管理員登入</h2>
    <input type="email" id="email" placeholder="管理員信箱">
    <input type="password" id="password" placeholder="密碼">
    <button id="login-btn" type="button">登入資料庫</button>
    <p id="login-msg" style="color: #ff6b6b; font-size: 14px;"></p>
  </div>

  <div id="app-view" class="box hidden">
    <div class="top-bar">
      <h2 style="margin:0;">逆水寒手游外觀資料庫</h2>
      <div style="display:flex; gap:8px;">
        <button id="toggle-form-btn" type="button" style="width:auto;">＋ 新增外觀</button>
        <button id="logout-btn" type="button" class="btn-sec" style="width:auto;">登出</button>
      </div>
    </div>

    <!-- 新增 / 編輯表單 -->
    <div id="add-form" class="hidden" style="background:#252525; padding:15px; border-radius:8px; margin-top:15px; border:1px solid #444;">
      <h3 id="form-title" style="margin-top:0;">新增外觀</h3>
      <input type="hidden" id="edit-id">
      <div class="row">
        <input type="text" id="category" placeholder="大類（例如：時裝、髮型、坐騎、武器）">
        <input type="text" id="subCategory" placeholder="子分類（例如：直售時裝、天賞髮、祥瑞）">
      </div>
      <div class="row">
        <input type="text" id="name" placeholder="外觀名稱 *">
        <input type="text" id="price" placeholder="售價（例如：2880紋玉 / 1顆天賞石）">
      </div>
      <input type="text" id="tags" placeholder="獎池標籤（用逗號分隔，如：天賞, 聯動, 限購, 染色）">
      <div class="row">
        <div>
          <label style="font-size:12px; color:#aaa;">台服上線日期</label>
          <input type="date" id="twDate">
        </div>
        <div>
          <label style="font-size:12px; color:#aaa;">陸服日期與版本</label>
          <input type="text" id="cnInfo" placeholder="例如：2024/05/24（1.3.2版本）">
        </div>
      </div>
      <textarea id="note" rows="2" placeholder="獲取途徑或備註"></textarea>
      <textarea id="imageUrls" rows="3" placeholder="貼上圖片網址（可貼多張，一行一個網址，第一張為封面）"></textarea>
      <div style="display:flex; gap:10px; margin-top:5px;">
        <button id="save-btn" type="button">儲存至雲端</button>
        <button id="cancel-btn" type="button" class="btn-sec">取消</button>
      </div>
    </div>

    <!-- 分頁切換 -->
    <div class="tabs">
      <button id="tab-gallery" class="tab-btn active" type="button">外觀圖鑑</button>
      <button id="tab-calendar" class="tab-btn" type="button">台服外觀日曆</button>
    </div>

    <!-- 圖鑑檢視 -->
    <div id="view-gallery">
      <div class="row">
        <input type="text" id="search" placeholder="搜尋名稱、分類、標籤或版本...">
        <select id="filter-cat">
          <option value="">所有大類</option>
        </select>
      </div>
      <div id="list" class="grid">載入中...</div>
    </div>

    <!-- 台服日曆檢視 -->
    <div id="view-calendar" class="hidden">
      <div id="calendar-list">載入中...</div>
    </div>
  </div>

  <!-- 多圖詳情檢視彈窗 -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="m-title" style="margin:0;"></h3>
        <button id="close-modal" type="button" class="btn-sec btn-sm">關閉</button>
      </div>
      <p id="m-meta" style="color:#aaa; font-size:13px;"></p>
      <p id="m-price" style="color:#f5a623; font-weight:bold;"></p>
      <div id="m-tags" style="margin-bottom:10px;"></div>
      <p id="m-note" style="background:#262626; padding:10px; border-radius:6px; white-space:pre-wrap; font-size:14px;"></p>
      <div id="m-imgs" class="modal-imgs"></div>
    </div>
  </div>

  <script>
    const proto = "ht" + "tps://";
    const host = ["www", "gstatic", "com"].join(".");
    const path = "/firebasejs/10.8.0/";
    const files = ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js"];

    function loadScript(file) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = proto + host + path + file;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    (async function init() {
      for (const f of files) await loadScript(f);

      // 👇 請貼回你原本可正常登入的那一組 firebaseConfig 👇
      const firebaseConfig = {
          apiKey: "AIzaSyBTRmc9Kh_8er4_-Z8QMAV5rQghcoK6HYU",
          authDomain: "nsh-db-1321c.firebaseapp.com",
          projectId: "nsh-db-1321c",
          storageBucket: "nsh-db-1321c.firebasestorage.app",
          messagingSenderId: "887842444277",
          appId: "1:887842444277:web:8d6372cc3362aa231bc6bc"
        };
      // 👆 替換結束 👆

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();
      let allOutfits = [];

      auth.onAuthStateChanged((user) => {
        if (user) {
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('app-view').classList.remove('hidden');
          loadOutfits();
        } else {
          document.getElementById('login-view').classList.remove('hidden');
          document.getElementById('app-view').classList.add('hidden');
        }
      });

      document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const pw = document.getElementById('password').value;
        const msgEl = document.getElementById('login-msg');
        msgEl.innerText = "正在驗證登入...";
        try {
          await auth.signInWithEmailAndPassword(email, pw);
          msgEl.innerText = "";
        } catch (e) {
          msgEl.innerText = "登入失敗：" + e.message;
        }
      });

      document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());

      function resetForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('form-title').innerText = "新增外觀";
        ['category', 'subCategory', 'name', 'price', 'tags', 'twDate', 'cnInfo', 'note', 'imageUrls'].forEach(id => {
          document.getElementById(id).value = "";
        });
      }

      document.getElementById('toggle-form-btn').addEventListener('click', () => {
        resetForm();
        document.getElementById('add-form').classList.toggle('hidden');
      });

      document.getElementById('cancel-btn').addEventListener('click', () => {
        document.getElementById('add-form').classList.add('hidden');
      });

      // 分頁切換
      document.getElementById('tab-gallery').addEventListener('click', () => {
        document.getElementById('tab-gallery').classList.add('active');
        document.getElementById('tab-calendar').classList.remove('active');
        document.getElementById('view-gallery').classList.remove('hidden');
        document.getElementById('view-calendar').classList.add('hidden');
      });

      document.getElementById('tab-calendar').addEventListener('click', () => {
        document.getElementById('tab-calendar').classList.add('active');
        document.getElementById('tab-gallery').classList.remove('active');
        document.getElementById('view-calendar').classList.remove('hidden');
        document.getElementById('view-gallery').classList.add('hidden');
        renderCalendar();
      });

      // 儲存（支援新增與編輯）
