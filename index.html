<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逆水寒手游外觀資料庫（私人版）</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #eee; margin: 0; padding: 20px; }
    .hidden { display: none !important; }
    .box { max-width: 900px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
    input, textarea, button { padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; width: 100%; box-sizing: border-box; }
    button { background: #4a90e2; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #357abd; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #262626; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
    .card img { width: 100%; height: 220px; object-fit: cover; }
    .card-body { padding: 12px; }
    .tag { display: inline-block; background: #3a3a3a; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 4px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .top-bar button { width: auto; }
  </style>
</head>
<body>

  <div id="login-view" class="box" style="max-width: 400px; margin-top: 80px;">
    <h2>管理員登入</h2>
    <input type="email" id="email" placeholder="管理員信箱">
    <input type="password" id="password" placeholder="密碼">
    <button id="login-btn" type="button">登入資料庫</button>
    <p id="login-msg" style="color: #ff6b6b; font-size: 14px;"></p>
  </div>

  <div id="app-view" class="box hidden">
    <div class="top-bar">
      <h2>逆水寒手游外觀資料庫</h2>
      <div>
        <button id="toggle-form-btn" type="button">＋ 新增外觀</button>
        <button id="logout-btn" type="button" style="background:#555;">登出</button>
      </div>
    </div>

    <div id="add-form" class="hidden" style="background:#252525; padding:15px; border-radius:8px; margin-top:15px;">
      <h3>新增外觀</h3>
      <input type="text" id="category" placeholder="大類（例如：時裝、髮型、坐騎）">
      <input type="text" id="name" placeholder="外觀名稱 *">
      <input type="text" id="price" placeholder="售價（例如：2880紋玉 / 1顆天賞石）">
      <input type="text" id="tags" placeholder="獎池標籤（用逗號分隔，如：天賞, 聯動, 限購）">
      <input type="date" id="twDate" title="台服上線日期">
      <textarea id="note" placeholder="獲取途徑或備註"></textarea>
      <textarea id="imageUrls" rows="3" placeholder="貼上圖片網址（可貼多張，一行一個網址，第一張為封面）"></textarea>
      <button id="save-btn" type="button">儲存至雲端</button>
    </div>

    <input type="text" id="search" placeholder="搜尋外觀名稱或標籤..." style="margin-top:15px;">
    <div id="list" class="grid">載入中...</div>
  </div>

  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC42rOglp4rkM9jo5KsJt-CPT6uJK3NN_O",
      authDomain: "://firebaseapp.com",
      projectId: "nsh-db-1321c",
      storageBucket: "nsh-db-1321c.firebasestorage.app",
      messagingSenderId: "887842444277",
      appId: "1:887842444277:web:0feb01d27c05c8f21bc6bc"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let allOutfits = [];

    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('hidden');
        loadOutfits();
      } else {
        document.getElementById('login-view').classList.remove('hidden');
        document.getElementById('app-view').classList.add('hidden');
      }
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('password').value;
      const msgEl = document.getElementById('login-msg');
      msgEl.innerText = "正在驗證登入...";
      try {
        await auth.signInWithEmailAndPassword(email, pw);
        msgEl.innerText = "";
      } catch (e) {
        msgEl.innerText = "登入失敗：" + e.message;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());
    document.getElementById('toggle-form-btn').addEventListener('click', () => {
      document.getElementById('add-form').classList.toggle('hidden');
    });

    document.getElementById('save-btn').addEventListener('click', async () => {
      const name = document.getElementById('name').value.trim();
      if (!name) return alert("請填寫外觀名稱！");
      const btn = document.getElementById('save-btn');
      btn.disabled = true; btn.innerText = "儲存中...";

      try {
        const urls = document.getElementById('imageUrls').value.split('\n').map(u => u.trim()).filter(Boolean);
        await db.collection("outfits").add({
          category: document.getElementById('category').value,
          name: name,
          price: document.getElementById('price').value,
          tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean),
          twDate: document.getElementById('twDate').value,
          note: document.getElementById('note').value,
          images: urls,
          createdAt: Date.now()
        });
        alert("儲存成功！");
        document.getElementById('add-form').classList.add('hidden');
        loadOutfits();
      } catch (e) {
        alert("儲存失敗：" + e.message);
      } finally {
        btn.disabled = false; btn.innerText = "儲存至雲端";
      }
    });

    async function loadOutfits() {
      const listEl = document.getElementById('list');
      listEl.innerHTML = "載入資料中...";
      try {
        const snapshot = await db.collection("outfits").orderBy("createdAt", "desc").get();
        allOutfits = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderList();
      } catch (e) {
        listEl.innerHTML = "讀取資料失敗：" + e.message;
      }
    }

    function renderList() {
      const kw = document.getElementById('search').value.toLowerCase();
      const filtered = allOutfits.filter(o => 
        o.name.toLowerCase().includes(kw) || (o.tags && o.tags.some(t => t.toLowerCase().includes(kw)))
      );
      document.getElementById('list').innerHTML = filtered.length ? filtered.map(o => `
        <div class="card">
          ${o.images && o.images[0] ? <img src="${o.images[0]}"> : `<div style="height:220px;background:#333;display:flex;align-items:center;justify-content:center;">無圖片</div>`}
          <div class="card-body">
            <div style="font-size:12px;color:#aaa;">${o.category || '未分類'} · ${o.twDate || '日期待定'}</div>
            <h4 style="margin:5px 0;">${o.name}</h4>
            <div style="color:#f5a623;font-size:14px;">${o.price || ''}</div>
            <div style="margin-top:6px;">${(o.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </div>
        </div>
      `).join('') : "目前尚無外觀資料";
    }

    document.getElementById('search').addEventListener('input', renderList);
  </script>
</body>
</html>
